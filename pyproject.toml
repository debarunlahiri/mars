[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mars"
version = "0.2.0"
description = "MARS: Multi-Agent Research System (LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.4",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "lxml_html_clean",
  "aiosqlite",
  "langgraph-checkpoint-sqlite",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]>=3.2",
  "pgvector",
  "numpy",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
local-embeddings = ["fastembed"]
dev = ["pytest", "pytest-asyncio", "ruff", "pgserver"]

[project.scripts]
mars = "mars.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mars"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
